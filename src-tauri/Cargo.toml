[package]
name = "trophy-navigator-desktop"


version = "0.9.34"
description = "Trophy Navigator Desktop"
authors = ["Andrey"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1"
sha2 = "0.10"
# Голосовой поиск (src/voice.rs): запись с микрофона и распознавание речи в приложении, без сервера
cpal = "0.15"
whisper-rs = "0.16"

# Щипок тачпада: перехват GDK_TOUCHPAD_PINCH у WebKitWebView (src/pinch.rs); версии — как у wry/tauri
[dev-dependencies]
hound = "3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
