name: Build Trophy Navigator Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2"
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: cargo tauri build
        working-directory: src-tauri
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TrophyNavigator-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
      - name: Upload msi
        uses: actions/upload-artifact@v4
        with:
          name: TrophyNavigator-Windows-msi
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2"
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: cargo tauri build
        working-directory: src-tauri
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: TrophyNavigator-Linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig

  build-macos:
    name: build-macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            artifact: TrophyNavigator-macOS-arm64
          - arch: x64
            runner: macos-15-intel
            artifact: TrophyNavigator-macOS-x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-${{ matrix.arch }}
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2"
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: cargo tauri build
        working-directory: src-tauri
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:'))
    permissions:
      contents: write
    env:
      UPDATES_DEPLOY_HOST: ${{ secrets.UPDATES_DEPLOY_HOST }}
      UPDATES_DEPLOY_USER: ${{ secrets.UPDATES_DEPLOY_USER }}
      UPDATES_DEPLOY_SSH_KEY: ${{ secrets.UPDATES_DEPLOY_SSH_KEY }}
      UPDATES_DEPLOY_KNOWN_HOSTS: ${{ secrets.UPDATES_DEPLOY_KNOWN_HOSTS }}
      LEGACY_DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      LEGACY_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      UPDATES_DEPLOY_PORT: ${{ vars.UPDATES_DEPLOY_PORT }}
      UPDATES_DEPLOY_PATH: ${{ vars.UPDATES_DEPLOY_PATH }}
      UPDATES_BETA_DEPLOY_PATH: ${{ vars.UPDATES_BETA_DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Get version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json', encoding='utf-8'))['version'])")"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Select release channel
        id: channel
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then
            echo "manifest_file=latest-desktop-beta.json" >> "$GITHUB_OUTPUT"
            echo "deploy_path=${UPDATES_BETA_DEPLOY_PATH:-/var/www/updates/latest-desktop-beta.json}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "manifest_file=latest-desktop.json" >> "$GITHUB_OUTPUT"
            echo "deploy_path=${UPDATES_DEPLOY_PATH:-/var/www/updates/latest-desktop.json}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare release assets
        id: assets
        run: |
          install -d release-assets
          find artifacts -maxdepth 5 -type f | sort
          copy_release_asset() {
            local src="$1"
            local prefix="${2:-}"
            local file asset
            file="$(basename "$src")"
            asset="${file// /.}"
            if [ -n "$prefix" ] && [ -e "release-assets/$asset" ]; then
              asset="${prefix}.${asset}"
            fi
            cp "$src" "release-assets/$asset"
            printf '%s' "$asset"
          }

          APPIMAGE_SRC=$(find artifacts/TrophyNavigator-Linux -maxdepth 1 -type f -name '*.AppImage' | head -n 1)
          NSIS_SRC=$(find artifacts/TrophyNavigator-Windows -maxdepth 1 -type f -name '*.exe' | head -n 1)
          MSI_SRC=$(find artifacts/TrophyNavigator-Windows-msi -maxdepth 1 -type f -name '*.msi' | head -n 1)
          MACOS_ARM64_DMG_SRC=$(find artifacts/TrophyNavigator-macOS-arm64 -type f -name '*.dmg' | head -n 1)
          MACOS_X64_DMG_SRC=$(find artifacts/TrophyNavigator-macOS-x64 -type f -name '*.dmg' | head -n 1)
          MACOS_ARM64_APP_SRC=$(find artifacts/TrophyNavigator-macOS-arm64 -type f -name '*.app.tar.gz' | head -n 1)
          MACOS_X64_APP_SRC=$(find artifacts/TrophyNavigator-macOS-x64 -type f -name '*.app.tar.gz' | head -n 1)
          if [ -z "$APPIMAGE_SRC" ] || [ -z "$NSIS_SRC" ]; then
            echo "Release artifacts not found" >&2
            exit 1
          fi

          APPIMAGE_ASSET_NAME=$(copy_release_asset "$APPIMAGE_SRC")
          NSIS_ASSET_NAME=$(copy_release_asset "$NSIS_SRC")

          if [ -n "$MSI_SRC" ]; then
            copy_release_asset "$MSI_SRC" >/dev/null
          fi

          if [ -n "$MACOS_ARM64_DMG_SRC" ]; then
            cp "$MACOS_ARM64_DMG_SRC" "release-assets/Trophy.Navigator.Desktop_${{ steps.version.outputs.version }}_aarch64.dmg"
          fi
          if [ -n "$MACOS_X64_DMG_SRC" ]; then
            cp "$MACOS_X64_DMG_SRC" "release-assets/Trophy.Navigator.Desktop_${{ steps.version.outputs.version }}_x64.dmg"
          fi

          if [ -n "$MACOS_ARM64_APP_SRC" ]; then
            cp "$MACOS_ARM64_APP_SRC" "release-assets/Trophy.Navigator.Desktop_${{ steps.version.outputs.version }}_aarch64.app.tar.gz"
            cp "${MACOS_ARM64_APP_SRC}.sig" "release-assets/Trophy.Navigator.Desktop_${{ steps.version.outputs.version }}_aarch64.app.tar.gz.sig"
          fi
          if [ -n "$MACOS_X64_APP_SRC" ]; then
            cp "$MACOS_X64_APP_SRC" "release-assets/Trophy.Navigator.Desktop_${{ steps.version.outputs.version }}_x64.app.tar.gz"
            cp "${MACOS_X64_APP_SRC}.sig" "release-assets/Trophy.Navigator.Desktop_${{ steps.version.outputs.version }}_x64.app.tar.gz.sig"
          fi

          if [ -z "$MACOS_ARM64_DMG_SRC" ] || [ -z "$MACOS_X64_DMG_SRC" ] || [ -z "$MACOS_ARM64_APP_SRC" ] || [ -z "$MACOS_X64_APP_SRC" ]; then
            echo "::error::macOS DMG/updater artifacts were not found for all architectures"
            exit 1
          fi

          echo "appimage_asset_name=$APPIMAGE_ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "nsis_asset_name=$NSIS_ASSET_NAME" >> "$GITHUB_OUTPUT"
      - name: Create latest.json for updater
        run: |
          VERSION=${{ steps.version.outputs.version }}
          MANIFEST_FILE=${{ steps.channel.outputs.manifest_file }}
          APPIMAGE_SIG=$(cat artifacts/TrophyNavigator-Linux/*.AppImage.sig 2>/dev/null || echo "")
          NSIS_SIG=$(cat artifacts/TrophyNavigator-Windows/*.exe.sig 2>/dev/null || echo "")
          MACOS_ARM64_SIG=$(cat "release-assets/Trophy.Navigator.Desktop_${VERSION}_aarch64.app.tar.gz.sig")
          MACOS_X64_SIG=$(cat "release-assets/Trophy.Navigator.Desktop_${VERSION}_x64.app.tar.gz.sig")
          MACOS_ARM64_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/Trophy.Navigator.Desktop_${VERSION}_aarch64.app.tar.gz"
          MACOS_X64_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/Trophy.Navigator.Desktop_${VERSION}_x64.app.tar.gz"
          cat > "$MANIFEST_FILE" << EOF
          {
            "version": "$VERSION",
            "notes": "Исправлено: ускорен старт приложения на Linux за счёт отложенной загрузки внешних библиотек; обычное скачивание офлайн-карт переведено на native SQLite writer без большого пика RAM; скачанные офлайн-карты корректно выключаются из списка. В GitHub Release добавлены macOS DMG-сборки для Apple Silicon и Intel.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "linux-x86_64": {
                "signature": "$APPIMAGE_SIG",
                "url": "https://trophynav.ru/releases/trophy-navigator-desktop_${VERSION}_amd64.AppImage"
              },
              "windows-x86_64": {
                "signature": "$NSIS_SIG",
                "url": "https://trophynav.ru/releases/trophy-navigator-desktop_${VERSION}_x64-setup.exe"
              },
              "darwin-aarch64": {
                "signature": "$MACOS_ARM64_SIG",
                "url": "$MACOS_ARM64_URL"
              },
              "darwin-x86_64": {
                "signature": "$MACOS_X64_SIG",
                "url": "$MACOS_X64_URL"
              }
            }
          }
          EOF
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Trophy Navigator Desktop v${{ steps.version.outputs.version }}
          prerelease: ${{ steps.channel.outputs.prerelease }}
          body: |
            ## Trophy Navigator Desktop v${{ steps.version.outputs.version }}

            ### Исправлено
            - Ускорен старт приложения на Linux: внешние `sql.js` и `Chart.js` больше не блокируют первый экран.
            - Обычное скачивание офлайн-карт теперь пишет SQLite на диск через native Rust без большого пика RAM.
            - Скачанные офлайн-карты корректно выключаются из списка и синхронизируют состояние с боковым списком слоёв.
            - Видимая версия приложения берётся из Tauri/Cargo, а не из hardcoded HTML.

            ### Скачать
            - **Windows**: `Trophy.Navigator.Desktop_*_x64-setup.exe` или `Trophy.Navigator.Desktop_*_x64_en-US.msi`
            - **Linux**: `Trophy.Navigator.Desktop_*_amd64.AppImage`
            - **macOS Apple Silicon**: `Trophy.Navigator.Desktop_*_aarch64.dmg`
            - **macOS Intel**: `Trophy.Navigator.Desktop_*_x64.dmg`

            ### Обновление
            В приложении: **ℹ О программе → Проверить обновление**
          files: |
            release-assets/*.exe
            release-assets/*.msi
            release-assets/*.AppImage
            release-assets/*.dmg
            release-assets/*.app.tar.gz
            release-assets/*.app.tar.gz.sig
            ${{ steps.channel.outputs.manifest_file }}
      - name: Publish updater manifest to server
        env:
          MANIFEST_FILE: ${{ steps.channel.outputs.manifest_file }}
          RELEASE_DEPLOY_PATH: ${{ steps.channel.outputs.deploy_path }}
        run: |
          set -euo pipefail

          DEPLOY_PORT="${UPDATES_DEPLOY_PORT:-22}"
          DEPLOY_HOST="${UPDATES_DEPLOY_HOST:-${LEGACY_DEPLOY_HOST:-}}"
          DEPLOY_USER="${UPDATES_DEPLOY_USER:-root}"
          DEPLOY_SSH_KEY="${UPDATES_DEPLOY_SSH_KEY:-${LEGACY_DEPLOY_SSH_KEY:-}}"
          DEPLOY_PATH="${RELEASE_DEPLOY_PATH}"

          if [ -z "${DEPLOY_HOST}" ] || [ -z "${DEPLOY_SSH_KEY}" ]; then
            echo "::error::Missing release deploy settings. Set UPDATES_DEPLOY_HOST/UPDATES_DEPLOY_SSH_KEY or reuse DEPLOY_HOST/DEPLOY_SSH_KEY from racenav."
            exit 1
          fi

          if [ ! -s "$MANIFEST_FILE" ]; then
            echo "::error::$MANIFEST_FILE was not generated."
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "${UPDATES_DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$UPDATES_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

          DEPLOY_DIR="$(dirname "$DEPLOY_PATH")"
          TMP_PATH="${DEPLOY_PATH}.tmp-${GITHUB_RUN_ID}"

          scp -P "$DEPLOY_PORT" -i ~/.ssh/id_ed25519 "$MANIFEST_FILE" "${DEPLOY_USER}@${DEPLOY_HOST}:${TMP_PATH}"
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "install -d -m 755 '${DEPLOY_DIR}' && install -m 644 '${TMP_PATH}' '${DEPLOY_PATH}' && rm -f '${TMP_PATH}'"
