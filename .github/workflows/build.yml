name: Build Trophy Navigator Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    # Закрытый репозиторий: минута Mac на GitHub считается за 10, Windows — за 2. Полная сборка — только для
    # выпуска (тег) или вручную; при push в main проверяет сборку один Linux (Андрей 10.10)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2"
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # whisper-rs-sys (голосовой поиск): bindgen ищет libclang — LLVM на windows-latest есть
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: cargo tauri build
        working-directory: src-tauri
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TrophyNavigator-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
      - name: Upload msi
        uses: actions/upload-artifact@v4
        with:
          name: TrophyNavigator-Windows-msi
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf squashfs-tools libasound2-dev libclang-dev cmake
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2"
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: cargo tauri build
        working-directory: src-tauri
      - name: Repack AppImage without bundled Wayland
        run: |
          set -euo pipefail

          # Bundler кладёт в AppImage собственные libwayland-* из образа сборки.
          # На системах со свежей Mesa системный libEGL не находит в них нужных
          # символов, не создаёт EGL display (EGL_BAD_PARAMETER) и пользователь
          # видит белое окно. Системный Wayland подходит всегда, поэтому bundled
          # копии вырезаются, а AppImage переупаковывается.
          #
          # Переупаковка идёт штатным mksquashfs из репозитория дистрибутива, а
          # runtime берётся из самого артефакта, поэтому в цепочку сборки не
          # попадает посторонний бинарник. Секретов в этом шаге нет.
          BUNDLE_DIR="src-tauri/target/release/bundle/appimage"
          APPIMAGE="$(find "$BUNDLE_DIR" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          if [ -z "$APPIMAGE" ]; then
            echo "::error::AppImage not found in $BUNDLE_DIR"
            exit 1
          fi
          APPIMAGE="$(realpath "$APPIMAGE")"

          WORK_DIR="$(mktemp -d)"
          cp "$APPIMAGE" "$WORK_DIR/app.AppImage"
          chmod +x "$WORK_DIR/app.AppImage"

          OFFSET="$("$WORK_DIR/app.AppImage" --appimage-offset)"
          SQUASHFS_INFO="$(unsquashfs -o "$OFFSET" -s "$WORK_DIR/app.AppImage")"
          COMPRESSION="$(printf '%s\n' "$SQUASHFS_INFO" | awk '/^Compression/ {print $2; exit}')"
          BLOCK_SIZE="$(printf '%s\n' "$SQUASHFS_INFO" | awk '/^Block size/ {print $3; exit}')"
          if [ -z "$OFFSET" ] || [ -z "$COMPRESSION" ] || [ -z "$BLOCK_SIZE" ]; then
            echo "::error::failed to read AppImage runtime offset or squashfs parameters"
            exit 1
          fi

          (cd "$WORK_DIR" && ./app.AppImage --appimage-extract >/dev/null)
          rm -f "$WORK_DIR"/squashfs-root/usr/lib/libwayland-*.so*

          GTK_HOOK="$WORK_DIR/squashfs-root/apprun-hooks/linuxdeploy-plugin-gtk.sh"
          if [ ! -f "$GTK_HOOK" ]; then
            echo "::error::linuxdeploy GTK AppRun hook not found"
            exit 1
          fi
          # Старый linuxdeploy-plugin-gtk навязывал x11 — меняем на Wayland по умолчанию. Новый (с 10.2026) строку
          # закомментировал и бэкенд не задаёт: GTK сам начинает с Wayland, менять нечего.
          sed -i 's/^export GDK_BACKEND=x11/export GDK_BACKEND="${GDK_BACKEND:-wayland}"/' "$GTK_HOOK"
          if grep -q '^export GDK_BACKEND=' "$GTK_HOOK" \
            && ! grep -Fq 'export GDK_BACKEND="${GDK_BACKEND:-wayland}"' "$GTK_HOOK"; then
            echo "::error::failed to make Wayland the default GDK backend"
            exit 1
          fi

          head -c "$OFFSET" "$WORK_DIR/app.AppImage" > "$WORK_DIR/runtime.bin"
          mksquashfs "$WORK_DIR/squashfs-root" "$WORK_DIR/fs.squashfs" \
            -comp "$COMPRESSION" -b "$BLOCK_SIZE" -root-owned -noappend -no-progress -quiet
          cat "$WORK_DIR/runtime.bin" "$WORK_DIR/fs.squashfs" > "$WORK_DIR/repacked.AppImage"
          chmod +x "$WORK_DIR/repacked.AppImage"

          rm -rf "$WORK_DIR/squashfs-root"
          (cd "$WORK_DIR" && ./repacked.AppImage --appimage-extract >/dev/null)
          if ls "$WORK_DIR"/squashfs-root/usr/lib/libwayland-*.so* >/dev/null 2>&1; then
            echo "::error::bundled Wayland libraries are still present after repacking"
            exit 1
          fi
          if grep -Rq '^export GDK_BACKEND=x11' "$WORK_DIR"/squashfs-root/apprun-hooks/*.sh; then
            echo "::error::AppImage still forces GDK_BACKEND=x11"
            exit 1
          fi
          REPACKED_HOOK="$WORK_DIR/squashfs-root/apprun-hooks/linuxdeploy-plugin-gtk.sh"
          if [ ! -f "$REPACKED_HOOK" ]; then
            echo "::error::GTK hook missing in repacked AppImage"
            exit 1
          fi
          if grep -q '^export GDK_BACKEND=' "$REPACKED_HOOK" \
            && ! grep -Fq 'export GDK_BACKEND="${GDK_BACKEND:-wayland}"' "$REPACKED_HOOK"; then
            echo "::error::repacked AppImage does not default to Wayland"
            exit 1
          fi
          # Updater выбирает способ установки по метке бандла в бинарнике.
          if ! grep -aq '__TAURI_BUNDLE_TYPE_VAR_APP' "$WORK_DIR"/squashfs-root/usr/bin/trophy-navigator-desktop; then
            echo "::error::AppImage binary has no AppImage bundle marker"
            exit 1
          fi

          mv "$WORK_DIR/repacked.AppImage" "$APPIMAGE"
          chmod +x "$APPIMAGE"
          rm -rf "$WORK_DIR"
      - name: Sign repacked AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail

          # Отдельный шаг: ключ подписи обновлений появляется в окружении только
          # для самой команды подписи и не соседствует с распаковкой,
          # переупаковкой и любым сторонним кодом.
          BUNDLE_DIR="src-tauri/target/release/bundle/appimage"
          APPIMAGE="$(find "$BUNDLE_DIR" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          if [ -z "$APPIMAGE" ]; then
            echo "::error::AppImage not found in $BUNDLE_DIR"
            exit 1
          fi
          APPIMAGE="$(realpath "$APPIMAGE")"

          # Прежняя подпись относится к исходному файлу; без переподписи updater
          # отвергнет обновление у всех пользователей Linux.
          rm -f "$APPIMAGE.sig"
          cargo tauri signer sign "$APPIMAGE"
          if [ ! -s "$APPIMAGE.sig" ]; then
            echo "::error::updater signature for the repacked AppImage was not created"
            exit 1
          fi
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: TrophyNavigator-Linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
      - name: Verify deb updater artifact
        run: |
          set -euo pipefail

          # С 0.9.27 DEB-установка обновляется сама (plugin: pkexec dpkg -i), поэтому
          # пакету нужна подпись updater-а и метка бандла DEB внутри бинарника:
          # без неё plugin пошёл бы по ветке AppImage и перезаписал /usr/bin (TRO-28).
          BUNDLE_DIR="src-tauri/target/release/bundle/deb"
          DEB="$(find "$BUNDLE_DIR" -maxdepth 1 -type f -name '*.deb' -print -quit)"
          if [ -z "$DEB" ]; then
            echo "::error::deb package not found in $BUNDLE_DIR"
            exit 1
          fi
          if [ ! -s "$DEB.sig" ]; then
            echo "::error::updater signature for the deb package was not created"
            exit 1
          fi
          WORK_DIR="$(mktemp -d)"
          dpkg-deb -x "$DEB" "$WORK_DIR"
          if ! grep -aq '__TAURI_BUNDLE_TYPE_VAR_DEB' "$WORK_DIR/usr/bin/trophy-navigator-desktop"; then
            echo "::error::deb binary has no DEB bundle marker"
            exit 1
          fi
          rm -rf "$WORK_DIR"
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: TrophyNavigator-Linux-deb
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig

  build-macos:
    name: build-macos-${{ matrix.arch }}
    # Закрытый репозиторий: минута Mac на GitHub считается за 10, Windows — за 2. Полная сборка — только для
    # выпуска (тег) или вручную; при push в main проверяет сборку один Linux (Андрей 10.10)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            artifact: TrophyNavigator-macOS-arm64
          - arch: x64
            runner: macos-15-intel
            artifact: TrophyNavigator-macOS-x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-${{ matrix.arch }}
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2"
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: cargo tauri build
        working-directory: src-tauri
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: trophy-desktop-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      UPDATES_DEPLOY_HOST: ${{ secrets.UPDATES_DEPLOY_HOST }}
      UPDATES_DEPLOY_USER: ${{ secrets.UPDATES_DEPLOY_USER }}
      UPDATES_DEPLOY_SSH_KEY: ${{ secrets.UPDATES_DEPLOY_SSH_KEY }}
      UPDATES_DEPLOY_KNOWN_HOSTS: ${{ secrets.UPDATES_DEPLOY_KNOWN_HOSTS }}
      UPDATES_DEPLOY_PORT: ${{ vars.UPDATES_DEPLOY_PORT }}
      UPDATES_DEPLOY_PATH: ${{ vars.UPDATES_DEPLOY_PATH }}
      UPDATES_BETA_DEPLOY_PATH: ${{ vars.UPDATES_BETA_DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Get version
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          CONFIG_VERSION="$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json', encoding='utf-8'))['version'])")"
          if [ "$VERSION" != "$CONFIG_VERSION" ]; then
            echo "::error::Tag version $VERSION does not match tauri.conf.json $CONFIG_VERSION"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Select release channel
        id: channel
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then
            echo "manifest_file=latest-desktop-beta.json" >> "$GITHUB_OUTPUT"
            echo "deploy_path=${UPDATES_BETA_DEPLOY_PATH:-/var/www/updates/latest-desktop-beta.json}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "manifest_file=latest-desktop.json" >> "$GITHUB_OUTPUT"
            echo "deploy_path=${UPDATES_DEPLOY_PATH:-/var/www/updates/latest-desktop.json}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare release assets
        id: assets
        run: |
          install -d release-assets
          find artifacts -maxdepth 5 -type f | sort
          copy_release_asset() {
            local src="$1"
            local prefix="${2:-}"
            local file asset
            file="$(basename "$src")"
            asset="${file// /.}"
            if [ -n "$prefix" ] && [ -e "release-assets/$asset" ]; then
              asset="${prefix}.${asset}"
            fi
            cp "$src" "release-assets/$asset"
            printf '%s' "$asset"
          }

          APPIMAGE_SRC=$(find artifacts/TrophyNavigator-Linux -maxdepth 1 -type f -name '*.AppImage' | head -n 1)
          DEB_SRC=$(find artifacts/TrophyNavigator-Linux-deb -maxdepth 1 -type f -name '*.deb' 2>/dev/null | head -n 1)
          NSIS_SRC=$(find artifacts/TrophyNavigator-Windows -maxdepth 1 -type f -name '*.exe' | head -n 1)
          MSI_SRC=$(find artifacts/TrophyNavigator-Windows-msi -maxdepth 1 -type f -name '*.msi' | head -n 1)
          MACOS_ARM64_DMG_SRC=$(find artifacts/TrophyNavigator-macOS-arm64 -type f -name '*.dmg' | head -n 1)
          MACOS_X64_DMG_SRC=$(find artifacts/TrophyNavigator-macOS-x64 -type f -name '*.dmg' | head -n 1)
          MACOS_ARM64_APP_SRC=$(find artifacts/TrophyNavigator-macOS-arm64 -type f -name '*.app.tar.gz' | head -n 1)
          MACOS_X64_APP_SRC=$(find artifacts/TrophyNavigator-macOS-x64 -type f -name '*.app.tar.gz' | head -n 1)
          # deb обязателен: с 0.9.27 он получает обновления через manifest (linux-x86_64-deb-pkexec).
          if [ -z "$APPIMAGE_SRC" ] || [ -z "$NSIS_SRC" ] || [ -z "$DEB_SRC" ]; then
            echo "Release artifacts not found" >&2
            exit 1
          fi

          APPIMAGE_ASSET_NAME=$(copy_release_asset "$APPIMAGE_SRC")
          NSIS_ASSET_NAME=$(copy_release_asset "$NSIS_SRC")
          copy_release_asset "$DEB_SRC" >/dev/null

          MSI_ASSET_NAME=""
          if [ -n "$MSI_SRC" ]; then
            MSI_ASSET_NAME=$(copy_release_asset "$MSI_SRC")
          fi

          if [ -n "$MACOS_ARM64_DMG_SRC" ]; then
            cp "$MACOS_ARM64_DMG_SRC" "release-assets/Trophy.Navigator.Desktop_${{ steps.version.outputs.version }}_aarch64.dmg"
          fi
          if [ -n "$MACOS_X64_DMG_SRC" ]; then
            cp "$MACOS_X64_DMG_SRC" "release-assets/Trophy.Navigator.Desktop_${{ steps.version.outputs.version }}_x64.dmg"
          fi

          if [ -n "$MACOS_ARM64_APP_SRC" ]; then
            cp "$MACOS_ARM64_APP_SRC" "release-assets/Trophy.Navigator.Desktop_${{ steps.version.outputs.version }}_aarch64.app.tar.gz"
            cp "${MACOS_ARM64_APP_SRC}.sig" "release-assets/Trophy.Navigator.Desktop_${{ steps.version.outputs.version }}_aarch64.app.tar.gz.sig"
          fi
          if [ -n "$MACOS_X64_APP_SRC" ]; then
            cp "$MACOS_X64_APP_SRC" "release-assets/Trophy.Navigator.Desktop_${{ steps.version.outputs.version }}_x64.app.tar.gz"
            cp "${MACOS_X64_APP_SRC}.sig" "release-assets/Trophy.Navigator.Desktop_${{ steps.version.outputs.version }}_x64.app.tar.gz.sig"
          fi

          if [ -z "$MACOS_ARM64_DMG_SRC" ] || [ -z "$MACOS_X64_DMG_SRC" ] || [ -z "$MACOS_ARM64_APP_SRC" ] || [ -z "$MACOS_X64_APP_SRC" ]; then
            echo "::error::macOS DMG/updater artifacts were not found for all architectures"
            exit 1
          fi

          echo "appimage_asset_name=$APPIMAGE_ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "nsis_asset_name=$NSIS_ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "msi_asset_name=$MSI_ASSET_NAME" >> "$GITHUB_OUTPUT"
      - name: Create latest.json for updater
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MANIFEST_FILE: ${{ steps.channel.outputs.manifest_file }}
          MSI_ASSET_NAME: ${{ steps.assets.outputs.msi_asset_name }}
        run: |
          set -euo pipefail

          # tauri-plugin-updater >= 2.10 ищет сначала `{os}-{arch}-{bundle}`
          # (linux-x86_64-appimage, windows-x86_64-nsis, windows-x86_64-msi,
          # darwin-aarch64-app), затем общий `{os}-{arch}`.
          # Общий linux-x86_64 остаётся AppImage-ом для сборок без метки бандла.
          # DEB >= 0.9.27 читает свой ключ linux-x86_64-deb-pkexec и ставит пакет
          # собственным кодом (pkexec без fallback). Стандартный linux-x86_64-deb
          # НЕ публикуется: его читают DEB 0.9.22–0.9.25, где plugin после отмены
          # pkexec уходит в zenity/kdialog/sudo (ревью Тима #2380).
          read_sig() {
            local file
            file="$(find "$1" -maxdepth 1 -type f -name "$2" -print -quit 2>/dev/null || true)"
            if [ -n "$file" ] && [ -s "$file" ]; then cat "$file"; fi
          }
          export APPIMAGE_SIG="$(read_sig artifacts/TrophyNavigator-Linux '*.AppImage.sig')"
          export DEB_SIG="$(read_sig artifacts/TrophyNavigator-Linux-deb '*.deb.sig')"
          export NSIS_SIG="$(read_sig artifacts/TrophyNavigator-Windows '*.exe.sig')"
          export MSI_SIG="$(read_sig artifacts/TrophyNavigator-Windows-msi '*.msi.sig')"
          export MACOS_ARM64_SIG="$(cat "release-assets/Trophy.Navigator.Desktop_${VERSION}_aarch64.app.tar.gz.sig")"
          export MACOS_X64_SIG="$(cat "release-assets/Trophy.Navigator.Desktop_${VERSION}_x64.app.tar.gz.sig")"
          export PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          python3 - <<'PY'
          import json
          import os
          import sys

          env = os.environ
          version = env["VERSION"]
          site = "https://trophynav.ru/releases"
          gh = f"https://github.com/{env['GITHUB_REPOSITORY']}/releases/download/v{version}"

          def entry(sig_var, url):
              sig = env.get(sig_var, "").strip()
              if not sig:
                  print(f"::error::updater signature {sig_var} is missing", file=sys.stderr)
                  sys.exit(1)
              return {"signature": sig, "url": url}

          appimage = entry("APPIMAGE_SIG", f"{site}/trophy-navigator-desktop_{version}_amd64.AppImage")
          deb = entry("DEB_SIG", f"{site}/trophy-navigator-desktop_{version}_amd64.deb")
          nsis = entry("NSIS_SIG", f"{site}/trophy-navigator-desktop_{version}_x64-setup.exe")
          # Mac и MSI — тоже с trophynav.ru: GitHub из России открывается ненадёжно (Андрей 10.10)
          mac_arm = entry("MACOS_ARM64_SIG", f"{site}/trophy-navigator-desktop_{version}_aarch64.app.tar.gz")
          mac_x64 = entry("MACOS_X64_SIG", f"{site}/trophy-navigator-desktop_{version}_x64.app.tar.gz")

          platforms = {
              "linux-x86_64": appimage,
              "linux-x86_64-appimage": appimage,
              "linux-x86_64-deb-pkexec": deb,
              "windows-x86_64": nsis,
              "windows-x86_64-nsis": nsis,
              "darwin-aarch64": mac_arm,
              "darwin-aarch64-app": mac_arm,
              "darwin-x86_64": mac_x64,
              "darwin-x86_64-app": mac_x64,
          }
          if "linux-x86_64-deb" in platforms:
              print("::error::linux-x86_64-deb would hand the deb to the unsafe plugin installer of DEB 0.9.22-0.9.25", file=sys.stderr)
              sys.exit(1)
          if env.get("MSI_ASSET_NAME") and env.get("MSI_SIG", "").strip():
              platforms["windows-x86_64-msi"] = entry("MSI_SIG", f"{site}/trophy-navigator-desktop_{version}_x64.msi")
          else:
              print("::warning::MSI updater artifact not found; MSI installs fall back to NSIS")

          manifest = {
              "version": version,
              "notes": "«О программе» и приветствие в фирменном стиле; в окнах подтверждения кнопка называет действие вместо «OK»; установщики Windows на русском; обновления для Mac и MSI — с trophynav.ru.",
              "pub_date": env["PUB_DATE"],
              "platforms": platforms,
          }
          with open(env["MANIFEST_FILE"], "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, ensure_ascii=False, indent=2)
              fh.write("\n")
          print(json.dumps(sorted(platforms), ensure_ascii=False))
          PY
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Trophy Navigator Desktop v${{ steps.version.outputs.version }}
          prerelease: ${{ steps.channel.outputs.prerelease }}
          body: |
            ## Trophy Navigator Desktop v${{ steps.version.outputs.version }}

            ### Изменено в 0.9.37
            - «О программе» и приветствие — в фирменном стиле: логотип-компас, карточки версии и лицензии, возможности и горячие клавиши под спойлерами.
            - В окнах подтверждения кнопка называет действие: «Обновить», «Установить», «Скачать», «Получить» — вместо «OK».
            - Вкладка скачанных офлайн-карт называется «Скачанные карты», как в окне «Карта и слои» («Мои карты» — только свои карты по адресу сервера).
            - Установщики для Windows — на русском языке.
            - Обновления для Mac и для установки через MSI скачиваются с trophynav.ru, как для остальных систем.
            - Исправлено: сообщения об успехе с галочкой ✅ подсвечивались оранжевым, а не зелёным; мелкий текст не меньше 10 px; метка «есть новое» — жёлтая.

            ### Новое в 0.9.36
            - Темы векторных карт (Базовая, Яркая, Топо, Офф) приходят с сервера: исправления оформления и новые темы появляются сами, без нового выпуска приложения. Проверка — при запуске, при появлении интернета и раз в полчаса; без интернета работают последние скачанные темы.
            - Встроенные темы обновлены до пакета стиля v19: в «Офф» — вырубки, поляны, кустарник, балки.
            - Когда на сервере есть новая версия скачанной карты области, на кнопке «Карта и слои» и у «Карты областей» горит жёлтый кружок, а внизу — «⟳ Новая версия карты: …» (клик открывает окно карт).
            - Пока скачивается новое оформление, внизу видно «Оформление карт: обновление…».

            ### Исправлено в 0.9.35
            - Клик по линии трека снова открывает список треков, правый клик — меню трека (раньше, как только на карте появлялись точки трека, клик уходил карте и открывалось меню карты).
            - Правка трека: клик по линии вставляет точку, «Разбить здесь» из меню по линии работает.

            ### Исправлено в 0.9.34
            - Windows: зум тачпадом (щипок и прокрутка двумя пальцами) снова плавный — в 0.9.33 холсты маршрутов и точек рисовались без видеокарты и тормозили.
            - Карта отдаляется меньше 11-го масштаба, даже если включена офлайн-карта с крупными тайлами поверх векторной основы.
            - Размер окон меняется за уголок в правом нижнем углу и на Linux (раньше за него было не ухватиться).
            - Трек из нескольких кусков (план из nakarte, запись с потерей сигнала GPS) загружается одним треком: куски без прямых «лучей» через карту, длина и анализ без прыжков, куски сохраняются в GPX.
            - Клик по треку в списке показывает его на карте; свойства трека и плеер в окне треков свёрнуты под спойлер.

            ### Новое с 0.9.33
            - Поиск мест из России и по скачанным картам без интернета; голосовой поиск прямо в приложении.
            - Анализ трека с графиками; новые виджеты; тема «Офф»; полноэкранный режим (кнопка «Экран», F11).
            - Список карт: карты и разделы переставляются перетаскиванием; прогресс скачивания карт в строке состояния.
            - GPX из nakarte с несколькими кусками трека не рисует прямых через карту.

            ### Скачать
            - **Windows**: `Trophy.Navigator.Desktop_*_x64-setup.exe` или `Trophy.Navigator.Desktop_*_x64_en-US.msi`
            - **Linux (Ubuntu/Debian, рекомендуется)**: `Trophy.Navigator.Desktop_*_amd64.deb` — ставится системно, обновляется из приложения с паролем администратора. Установки DEB 0.9.26 и старше один раз обновите вручную: `sudo apt install ./файл.deb`
            - **Linux (AppImage)**: `Trophy.Navigator.Desktop_*_amd64.AppImage` — требует FUSE 2 для штатного запуска и автообновления
            - **macOS Apple Silicon**: `Trophy.Navigator.Desktop_*_aarch64.dmg`
            - **macOS Intel**: `Trophy.Navigator.Desktop_*_x64.dmg`

            ### Обновление
            В приложении: **ℹ О программе → Проверить обновление**
          files: |
            release-assets/*.exe
            release-assets/*.msi
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.dmg
            release-assets/*.app.tar.gz
            release-assets/*.app.tar.gz.sig
            ${{ steps.channel.outputs.manifest_file }}
      - name: Publish updater assets and manifest to Alpha-KM
        env:
          MANIFEST_FILE: ${{ steps.channel.outputs.manifest_file }}
          RELEASE_DEPLOY_PATH: ${{ steps.channel.outputs.deploy_path }}
          APPIMAGE_FILE: release-assets/${{ steps.assets.outputs.appimage_asset_name }}
          NSIS_FILE: release-assets/${{ steps.assets.outputs.nsis_asset_name }}
          DEB_FILE: release-assets/Trophy.Navigator.Desktop_${{ steps.version.outputs.version }}_amd64.deb
          MSI_FILE: release-assets/${{ steps.assets.outputs.msi_asset_name }}
          MSI_ASSET_NAME: ${{ steps.assets.outputs.msi_asset_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          DEPLOY_PORT="${UPDATES_DEPLOY_PORT:-22}"
          DEPLOY_HOST="${UPDATES_DEPLOY_HOST:-}"
          DEPLOY_USER="${UPDATES_DEPLOY_USER:-}"
          DEPLOY_SSH_KEY="${UPDATES_DEPLOY_SSH_KEY:-}"
          DEPLOY_PATH="${RELEASE_DEPLOY_PATH}"
          PUBLIC_RELEASE_DIR="/var/www/trophy-site/releases"
          V="${RELEASE_VERSION}"
          # Файл выпуска → публичное имя на trophynav.ru/releases (кнопки сайта и манифест обновлений)
          PUBLIC_FILES=(
            "${APPIMAGE_FILE}|trophy-navigator-desktop_${V}_amd64.AppImage"
            "${NSIS_FILE}|trophy-navigator-desktop_${V}_x64-setup.exe"
            "${DEB_FILE}|trophy-navigator-desktop_${V}_amd64.deb"
            "release-assets/Trophy.Navigator.Desktop_${V}_aarch64.dmg|trophy-navigator-desktop_${V}_aarch64.dmg"
            "release-assets/Trophy.Navigator.Desktop_${V}_x64.dmg|trophy-navigator-desktop_${V}_x64.dmg"
            "release-assets/Trophy.Navigator.Desktop_${V}_aarch64.app.tar.gz|trophy-navigator-desktop_${V}_aarch64.app.tar.gz"
            "release-assets/Trophy.Navigator.Desktop_${V}_x64.app.tar.gz|trophy-navigator-desktop_${V}_x64.app.tar.gz"
          )
          if [ -n "${MSI_ASSET_NAME:-}" ]; then PUBLIC_FILES+=("${MSI_FILE}|trophy-navigator-desktop_${V}_x64.msi"); fi

          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "${UPDATES_DEPLOY_KNOWN_HOSTS:-}" ]; then
            echo "::error::Missing dedicated UPDATES_DEPLOY_* settings. Legacy deploy fallback is forbidden."
            exit 1
          fi

          if [ "$DEPLOY_HOST" != "104.171.128.204" ] || [ "$DEPLOY_USER" != "tnd-deploy" ] || [ "$DEPLOY_PORT" != "22" ]; then
            echo "::error::Updater deploy must target tnd-deploy@104.171.128.204:22, got ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PORT}."
            exit 1
          fi

          case "$DEPLOY_PATH" in
            /var/www/updates/latest-desktop.json|/var/www/updates/latest-desktop-beta.json) ;;
            *) echo "::error::Unexpected updater manifest path: $DEPLOY_PATH"; exit 1 ;;
          esac

          if [ ! -s "$MANIFEST_FILE" ]; then echo "::error::Release manifest is missing."; exit 1; fi
          for pair in "${PUBLIC_FILES[@]}"; do
            src="${pair%%|*}"
            if [ ! -s "$src" ]; then echo "::error::Public release asset is missing: $src"; exit 1; fi
          done

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$UPDATES_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          DEPLOY_DIR="$(dirname "$DEPLOY_PATH")"
          MANIFEST_TMP="${DEPLOY_PATH}.tmp-${GITHUB_RUN_ID}"
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"
          TMP_SUFFIX=".tmp-${GITHUB_RUN_ID}"
          REMOTE_TMPS="'${MANIFEST_TMP}'"
          for pair in "${PUBLIC_FILES[@]}"; do REMOTE_TMPS="${REMOTE_TMPS} '${PUBLIC_RELEASE_DIR}/${pair##*|}${TMP_SUFFIX}'"; done

          cleanup_remote() {
            ssh -p "$DEPLOY_PORT" -i ~/.ssh/id_ed25519 "$REMOTE" "rm -f ${REMOTE_TMPS}" || true
          }
          trap cleanup_remote EXIT

          ssh -p "$DEPLOY_PORT" -i ~/.ssh/id_ed25519 "$REMOTE" \
            "test '${DEPLOY_DIR}' = '/var/www/updates' && test -w '${DEPLOY_DIR}' && test -w '${PUBLIC_RELEASE_DIR}'"

          scp -P "$DEPLOY_PORT" -i ~/.ssh/id_ed25519 "$MANIFEST_FILE" "$REMOTE:$MANIFEST_TMP"
          CHECKS=""
          INSTALLS=""
          for pair in "${PUBLIC_FILES[@]}"; do
            src="${pair%%|*}"; name="${pair##*|}"
            dst="${PUBLIC_RELEASE_DIR}/${name}"
            scp -P "$DEPLOY_PORT" -i ~/.ssh/id_ed25519 "$src" "$REMOTE:${dst}${TMP_SUFFIX}"
            CHECKS="${CHECKS}$(sha256sum "$src" | awk '{print $1}')  ${dst}${TMP_SUFFIX}\n"
            INSTALLS="${INSTALLS} && install -m 644 '${dst}${TMP_SUFFIX}' '${dst}'"
          done
          # Сначала все суммы сходятся — только потом файлы получают публичные имена
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/id_ed25519 "$REMOTE" \
            "printf '${CHECKS}' | sha256sum -c - >/dev/null ${INSTALLS}"

          for pair in "${PUBLIC_FILES[@]}"; do
            curl --fail --silent --show-error --retry 5 --retry-delay 3 --head \
              "https://trophynav.ru/releases/${pair##*|}" >/dev/null
          done

          # Manifest публикуется последним: updater никогда не увидит URL ещё не выложенных файлов.
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/id_ed25519 "$REMOTE" \
            "install -m 644 '${MANIFEST_TMP}' '${DEPLOY_PATH}'"
          trap - EXIT
          cleanup_remote
